services:
  prooflift-posts-db:
    image: postgres
    container_name: prooflift-posts-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"

  prooflift-posts-be:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: prooflift-posts-be
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - prooflift-posts-db
